# Build and publish the container images in containers/ to ghcr.io/chatpanel/*.
#
# IT LIVES IN THIS REPO, AND THAT IS THE POINT. It used to live in the private hub, where it
# never once succeeded:
#   • the push was refused — `denied: permission_denied: The requested installation does not
#     exist` — because that repo's GITHUB_TOKEN could not write packages in this namespace;
#   • a package pushed from a PRIVATE repo inherits private visibility, so even a successful
#     build would have left users with a 403 on `podman pull`;
#   • and since 2026-09-21 every job on the org has been refused at start over the billing
#     spending limit.
# All three go away here: the token owns the namespace, the package can be public so anyone can
# pull it, and Actions on standard runners are free for public repositories, so the spending
# limit does not reach these builds.
#
# ONE CALL PER IMAGE, not one shared matrix. The images have wildly different build times —
# reranker-cpu and opendecision-cpu take 2 minutes, vllm-cpu compiles torch and vLLM from
# source and takes the best part of an hour. A shared matrix makes the merge job wait on
# `needs: build`, which is the WHOLE matrix, so the two fast images sat built-but-untagged
# behind the slow one and could not ship without it. Each call gets its own build→merge chain,
# so a one-line fix to a fast image publishes in three minutes whatever vllm-cpu is doing.
#
# The per-image detail — native runners, push-by-digest, the manifest merge, the visibility
# check — is in _image.yml, once, rather than three times here.
name: Capability images

on:
  push:
    branches: [main]
    paths: ['containers/**', '.github/workflows/capability-images.yml', '.github/workflows/_image.yml']
  pull_request:
    paths: ['containers/**', '.github/workflows/capability-images.yml', '.github/workflows/_image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  reranker-cpu:
    uses: ./.github/workflows/_image.yml
    with:
      image: reranker-cpu
      push: ${{ github.event_name != 'pull_request' }}

  opendecision-cpu:
    uses: ./.github/workflows/_image.yml
    with:
      image: opendecision-cpu
      push: ${{ github.event_name != 'pull_request' }}

  vllm-cpu:
    uses: ./.github/workflows/_image.yml
    with:
      image: vllm-cpu
      push: ${{ github.event_name != 'pull_request' }}
